backend:
  name: github
  repo: younes1nourddine/Bock-Energieberatung
  branch: main
  auth_type: pkce
  app_id: Ov23liAZEd9zrOCU8TKX
  base_url: https://bock-energieberatung.vercel.app

media_folder: images
public_folder: /images

locale: de

collections:

  - name: allgemein
    label: Allgemein
    files:

      - name: kontakt
        label: Kontakt & Firma
        file: content/global.json
        format: json
        fields:
          - { label: Telefon, name: phone, widget: string, hint: "z. B. 0155 6172 2088" }
          - { label: E-Mail, name: email, widget: string }
          - { label: Adresse, name: address, widget: string }
          - { label: Region (Footer-Text), name: region, widget: string }

      - name: startseite
        label: Startseite
        file: content/homepage.json
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Überschrift (weiß), name: title, widget: string }
              - { label: Überschrift Akzent (grün), name: title_em, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Button 1 Text, name: btn_primary, widget: string }
              - { label: Button 2 Text, name: btn_ghost, widget: string }
              - { label: Hinweistext, name: banner, widget: text }
          - label: Über mich (Abschnitt auf Startseite)
            name: ueber
            widget: object
            fields:
              - { label: Überschrift, name: title, widget: string }
              - { label: Absatz 1, name: text1, widget: text }
              - { label: Absatz 2, name: text2, widget: text }
          - label: Kontaktbereich
            name: kontakt
            widget: object
            fields:
              - { label: Überschrift, name: title, widget: string }
              - { label: Untertext, name: text, widget: string }

      - name: sanierungsfahrplan
        label: Seite Sanierungsfahrplan
        file: content/sanierungsfahrplan.json
        format: json
        fields:
          - { label: Seitentitel (H1), name: h1, widget: string }
          - { label: Untertitel, name: subtitle, widget: string }
          - { label: Einleitung Text, name: intro, widget: text }
          - { label: Fördertext, name: foerder_text, widget: text }

      - name: baubegleitung
        label: Seite Baubegleitung
        file: content/baubegleitung.json
        format: json
        fields:
          - { label: Seitentitel (H1), name: h1, widget: string }
          - { label: Untertitel, name: subtitle, widget: string }
          - { label: Einleitung Absatz 1, name: intro1, widget: text }
          - { label: Einleitung Absatz 2, name: intro2, widget: text }

      - name: energieausweis
        label: Seite Energieausweis
        file: content/energieausweis.json
        format: json
        fields:
          - { label: Seitentitel (H1), name: h1, widget: string }
          - { label: Untertitel, name: subtitle, widget: string }
          - { label: Pflichthinweis Text, name: pflicht_text, widget: text }

      - name: ueber_mich
        label: Seite Über mich
        file: content/ueber-mich.json
        format: json
        fields:
          - { label: Motivationstext (Zitat), name: motivation, widget: text }
